<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Obejkterkennung - On-Device AI</title>
</head>
<body>

    <div class="card">
        <h1>On-Device AI - Objekterkennung mit WebGPU</h1>
        <p class="instructions">Lade ein Bild hoch um die Objekterkennung (z.B. mit einem Tierfoto) zu starten. Es findet keine Übertragung deines Bildes statt, das Bild verbleibt auf deinem Endgerät und wird dort analysiert.</p>

        <div>
            <div class="input-container">
                <div class="input-box">
                    <label for="file-input">Bild auswählen: </label>
                    <input type="file" id="file-input" class="form-control file-input" accept="image/*">
                </div>
            </div>
            
            <div id="image-container"></div>

            <div class="result-container">
                <p id="result" class="result-box"></p>
            </div>
        </div>

                <a href="datenschutz.html">Datenschutz</a>
            </div>
        </footer>
    </div>

    <script type="module" src="./objekterkennung-webgpu.js"></script>
</body>
</html>
